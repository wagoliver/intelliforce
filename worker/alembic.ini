; =============================================================================
; Alembic configuration — IntelliForce
; =============================================================================

[alembic]
script_location = intelliforce/db/migrations
prepend_sys_path = .

; Timezone das timestamps das migrations
timezone = UTC

; Truncate o nome de novas migrations em N caracteres
truncate_slug_length = 40

; Caminho dos arquivos de versão
version_locations = %(here)s/intelliforce/db/migrations/versions

; URL é override pelo env.py via env vars
sqlalchemy.url = postgresql://intelliforce:placeholder@postgres:5432/intelliforce

; -----------------------------------------------------------------------------
; Logging
; -----------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
