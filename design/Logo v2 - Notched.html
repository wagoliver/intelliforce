<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>IntelliForce — Notched Square refinements</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fafaf9;
      --bg-elev: #ffffff;
      --bg-sunken: #f4f4f3;
      --border: oklch(0.92 0.005 250);
      --border-strong: oklch(0.86 0.008 250);
      --text: oklch(0.20 0.012 255);
      --text-muted: oklch(0.50 0.012 255);
      --text-subtle: oklch(0.65 0.010 255);
      --accent: oklch(0.42 0.13 265);
      --accent-soft: oklch(0.96 0.02 265);
      --font-sans: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      --font-display: "Inter Tight", "Inter", sans-serif;
    }
    html, body { margin: 0; padding: 0; background: var(--bg-sunken); color: var(--text); font-family: var(--font-sans); }
    * { box-sizing: border-box; }

    /* Logo card layout */
    .logo-card {
      width: 100%; height: 100%;
      background: var(--bg-elev);
      display: grid;
      grid-template-rows: 1fr auto auto;
      align-items: center; justify-items: center;
      padding: 32px 24px 24px;
      gap: 20px;
    }
    .logo-stage {
      display: grid; place-items: center;
      width: 100%;
    }
    .logo-mark {
      width: 96px; height: 96px;
      display: block;
    }
    .logo-mark svg { display: block; width: 100%; height: 100%; }

    .logo-foot {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      width: 100%;
      border-top: 1px solid var(--border);
      padding-top: 16px;
    }
    .logo-name {
      font-family: var(--font-display);
      font-size: 13px; font-weight: 600;
      color: var(--text);
      letter-spacing: -0.01em;
    }
    .logo-desc {
      font-size: 11px; color: var(--text-subtle);
      line-height: 1.45; text-align: center;
      max-width: 200px;
    }

    /* Lockup card (bigger) */
    .lockup-card {
      width: 100%; height: 100%;
      background: var(--bg-elev);
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 20px;
      padding: 32px 36px;
    }
    .lockup-card .logo-mark { width: 64px; height: 64px; }
    .lockup-word {
      font-family: var(--font-display);
      font-size: 32px; font-weight: 600;
      color: var(--text);
      letter-spacing: -0.03em;
    }
    .lockup-word .force {
      font-weight: 500;
      color: var(--text-muted);
    }

    /* Dark variant card */
    .logo-card.dark {
      background: oklch(0.18 0.012 255);
      color: oklch(0.92 0.008 255);
    }
    .logo-card.dark .logo-foot { border-color: oklch(0.28 0.014 255); }
    .logo-card.dark .logo-name { color: oklch(0.94 0.008 255); }
    .logo-card.dark .logo-desc { color: oklch(0.65 0.012 255); }

    /* Scale grid (sizes) */
    .scale-card {
      width: 100%; height: 100%;
      background: var(--bg-elev);
      padding: 28px 32px;
      display: grid;
      grid-template-columns: 1fr;
      align-items: center;
      gap: 24px;
    }
    .scale-row {
      display: flex; align-items: center; gap: 28px;
    }
    .scale-row .s-16 svg { width: 16px; height: 16px; }
    .scale-row .s-24 svg { width: 24px; height: 24px; }
    .scale-row .s-32 svg { width: 32px; height: 32px; }
    .scale-row .s-48 svg { width: 48px; height: 48px; }
    .scale-row .s-72 svg { width: 72px; height: 72px; }
    .scale-row .s-96 svg { width: 96px; height: 96px; }
    .scale-label {
      font-family: var(--font-display);
      font-size: 11px; color: var(--text-subtle);
      letter-spacing: 0.04em; text-transform: uppercase;
    }

    /* Construction / grid card */
    .construction-card {
      width: 100%; height: 100%;
      background: var(--bg-elev);
      padding: 24px;
      display: grid; place-items: center;
    }
    .construction-svg { width: 320px; height: 320px; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="notched-variants.jsx"></script>
  <script type="text/babel" src="notched-canvas.jsx"></script>
</body>
</html>
